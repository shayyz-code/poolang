name: Commit Policy

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commit-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require Conventional Commits
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const header = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: \S.*$/;
            const maxLength = 72;

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const failures = [];
            for (const commit of commits) {
              const subject = commit.commit.message.split("\n")[0];
              const sha = commit.sha.slice(0, 7);
              const problems = [];

              if (commit.parents.length > 1) {
                problems.push("merge commits are not allowed; rebase onto main instead");
              }
              if (/^(fixup|squash|amend)!/.test(subject)) {
                problems.push("autosquash commit; run git rebase -i --autosquash before pushing");
              }
              if (/\bWIP\b/.test(subject)) {
                problems.push("work-in-progress commit");
              }
              if (!header.test(subject)) {
                problems.push("header must match <type>(<scope>)?!?: <description>");
              }
              const length = [...subject].length;
              if (length > maxLength) {
                problems.push(`header is ${length} characters; the limit is ${maxLength}`);
              }

              if (problems.length > 0) {
                failures.push(`${sha} ${subject}\n  - ${problems.join("\n  - ")}`);
              }
            }

            if (failures.length > 0) {
              core.setFailed(
                `${failures.length} of ${commits.length} commit(s) violate the commit policy:\n\n` +
                  failures.join("\n\n") +
                  "\n\nAllowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert.",
              );
              return;
            }

            core.info(`All ${commits.length} commit(s) follow the commit policy.`);
