name: Commit Policy

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commit-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require Conventional Commits
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const header = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: \S.*$/;
            const maxLength = 72;

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const failures = [];
            for (const commit of commits) {
              const subject = commit.commit.message.split("\n")[0];
              const sha = commit.sha.slice(0, 7);
              const problems = [];

              if (commit.parents.length > 1) {
                problems.push("merge commits are not allowed; rebase onto main instead");
              }
              if (/^(fixup|squash|amend)!/.test(subject)) {
                problems.push("autosquash commit; run git rebase -i --autosquash before pushing");
              }
              if (/\bWIP\b/.test(subject)) {
                problems.push("work-in-progress commit");
              }
              if (!header.test(subject)) {
                problems.push("header must match <type>(<scope>)?!?: <description>");
              }
              const length = [...subject].length;
              if (length > maxLength) {
                problems.push(`header is ${length} characters; the limit is ${maxLength}`);
              }

              if (problems.length > 0) {
                failures.push(`${sha} ${subject}\n  - ${problems.join("\n  - ")}`);
              }
            }

            if (failures.length > 0) {
              core.setFailed(
                `${failures.length} of ${commits.length} commit(s) violate the commit policy:\n\n` +
                  failures.join("\n\n") +
                  "\n\nAllowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert.",
              );
              return;
            }

            core.info(`All ${commits.length} commit(s) follow the commit policy.`);

  commit-builds:
    name: Commit builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      MAX_COMMITS: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Check and test each commit
        run: |
          set -u
          commits=$(git rev-list --reverse "$BASE_SHA..$HEAD_SHA")
          total=$(printf '%s\n' "$commits" | grep -c . || true)

          if [ "$total" -eq 0 ]; then
            echo "No commits to build."
            exit 0
          fi

          if [ "$total" -gt "$MAX_COMMITS" ]; then
            echo "::notice::PR has $total commits; building only the $MAX_COMMITS most recent."
            commits=$(printf '%s\n' "$commits" | tail -n "$MAX_COMMITS")
          fi

          failed=""
          for sha in $commits; do
            short=$(git rev-parse --short "$sha")
            echo "::group::$short $(git log -1 --format=%s "$sha")"
            git checkout --force --quiet --detach "$sha" || {
              echo "::endgroup::"
              echo "::error::Cannot check out commit $short"
              failed="$failed $short"
              continue
            }
            if cargo check --all-targets && cargo test --quiet; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::Commit $short does not build or pass tests"
              failed="$failed $short"
            fi
          done

          git checkout --force --quiet --detach "$HEAD_SHA"

          if [ -n "$failed" ]; then
            echo "Commits that failed cargo check or cargo test:$failed"
            exit 1
          fi

          echo "All checked commits build and pass tests."
