name: Pull Request Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  issue-link:
    name: Issue link
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Require one pre-existing issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const pull = context.payload.pull_request;
            const body = pull.body || "";
            const references = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi)]
              .map((match) => Number(match[1]));
            const unique = [...new Set(references)];

            if (unique.length !== 1) {
              core.setFailed("PR body must contain exactly one closing issue reference, for example: Closes #123");
              return;
            }

            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: unique[0],
            });

            if (issue.data.pull_request) {
              core.setFailed(`#${unique[0]} is a pull request, not an issue`);
              return;
            }

            if (Date.parse(issue.data.created_at) > Date.parse(pull.created_at)) {
              core.setFailed(`#${unique[0]} was created after this pull request`);
            }

  cargo-check:
    name: Cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0
      - name: Run fast checks
        run: just check-fast

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0,mdbook@0.5.2
      - name: Build and test the book
        run: just docs

  dist:
    name: Dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0
      - name: Install dist
        # install-action has no native cargo-dist manifest, so use the same
        # pinned installer as the generated release workflow. bash gives
        # pipefail, which guards against a failed curl.
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh"
      - name: Check release workflow is up to date
        run: just dist-check
