name: Pull Request Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  issue-link:
    name: Issue link
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Require one pre-existing issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const pull = context.payload.pull_request;
            const body = pull.body || "";
            const references = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi)]
              .map((match) => Number(match[1]));
            const unique = [...new Set(references)];

            if (unique.length !== 1) {
              core.setFailed("PR body must contain exactly one closing issue reference, for example: Closes #123");
              return;
            }

            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: unique[0],
            });

            if (issue.data.pull_request) {
              core.setFailed(`#${unique[0]} is a pull request, not an issue`);
              return;
            }

            if (Date.parse(issue.data.created_at) > Date.parse(pull.created_at)) {
              core.setFailed(`#${unique[0]} was created after this pull request`);
            }

  cargo-check:
    name: Cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check compilation
        run: cargo check --all-targets
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test
