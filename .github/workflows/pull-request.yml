name: Pull Request Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  issue-link:
    name: Issue link
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Require one pre-existing issue
        uses: actions/github-script@v7
        with:
          script: |
            const pull = context.payload.pull_request;
            const body = pull.body || "";
            const references = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi)]
              .map((match) => Number(match[1]));
            const unique = [...new Set(references)];

            if (unique.length !== 1) {
              core.setFailed("PR body must contain exactly one closing issue reference, for example: Closes #123");
              return;
            }

            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: unique[0],
            });

            if (issue.data.pull_request) {
              core.setFailed(`#${unique[0]} is a pull request, not an issue`);
              return;
            }

            if (Date.parse(issue.data.created_at) > Date.parse(pull.created_at)) {
              core.setFailed(`#${unique[0]} was created after this pull request`);
            }

  cargo-check:
    name: Cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo check --all-targets
